<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pin Tool - Hub Confirm</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <style>
        :root {
            --bg-color: #121826;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #0ea5e9;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;

            /* Pin Colors */
            --pin-main: #3b82f6; /* Blue */
            --pin-carpark: #f97316; /* Orange */
            --pin-bus: #22c55e; /* Green */
            --pin-cycle: #eab308; /* Yellow */
            --pin-taxi: #ef4444; /* Red */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar */
        .topbar {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            box-sizing: border-box;
            z-index: 1000;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 1.2rem;
            padding: 5px;
        }

        .back-btn:hover { color: var(--text-main); }

        .station-title {
            margin: 0;
            font-size: 1.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 400px;
        }

        .station-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-text {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn-flag, .btn-filter {
            background: transparent;
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-flag.active {
            background: var(--warning);
            color: white;
        }

        /* Search Filter Overlay */
        .filter-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .filter-modal {
            background: var(--panel-bg);
            padding: 20px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            border: 1px solid var(--border);
        }

        /* Main Layout */
        .main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
            position: relative;
        }

        /* Left Panel */
        .sidebar {
            width: 350px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 500;
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .panel-section h3 {
            margin: 0 0 15px 0;
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Forms & Inputs */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select, input[type="text"], textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }

        select:focus, input:focus, textarea:focus {
            outline: 1px solid var(--accent);
            border-color: var(--accent);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        /* Car Park Toggle */
        .toggle-group {
            display: flex;
            gap: 10px;
        }
        .toggle-btn {
            flex: 1;
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .toggle-btn.active-yes { background: var(--success); color: white; border-color: var(--success); }
        .toggle-btn.active-no { background: var(--danger); color: white; border-color: var(--danger); }
        .toggle-btn.active-unsure { background: var(--warning); color: #000; border-color: var(--warning); }

        /* Pins List */
        .pins-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .pin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid var(--border);
            cursor: pointer;
        }
        .pin-item:hover {
            background: rgba(255,255,255,0.05);
        }
        .pin-type-main { border-left-color: var(--pin-main); }
        .pin-type-car_park { border-left-color: var(--pin-carpark); }
        .pin-type-bus_interchange { border-left-color: var(--pin-bus); }
        .pin-type-cycle_entrance { border-left-color: var(--pin-cycle); }
        .pin-type-taxi_rank { border-left-color: var(--pin-taxi); }

        .pin-actions span {
            color: var(--danger);
            cursor: pointer;
            padding: 5px;
        }

        /* Map Area */
        #map {
            flex: 1;
            background-color: #aadaff; /* Default map bg */
            z-index: 100;
        }

        /* Controls (Bottom panel) */
        .controls {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
        }

        .btn {
            padding: 12px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            font-size: 1rem;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-primary { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }
        .nav-buttons .btn { flex: 1; }

        /* Coordinates Display */
        .coords-display {
            font-family: monospace;
            background: #000;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #0f0;
            margin-top: 10px;
        }

        /* Responsive Mobile */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            #map {
                height: 55%;
                flex: none;
            }
            .sidebar {
                width: 100%;
                height: 45%;
                border-right: none;
                border-top: 1px solid var(--border);
            }
            .topbar-right .progress-text { display: none; }
            .station-title { font-size: 1rem; }
        }

        /* Notification Toast */
        #toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--success);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 9999;
        }

        /* Pulse Animation */
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0.7)); }
            50% { transform: scale(1.1); filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.9)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(239, 68, 68, 0)); }
        }
        .pulse-anim {
            animation: pulse 1.5s infinite;
        }

        .external-links a {
            color: var(--accent);
            text-decoration: none;
            margin-right: 10px;
            font-size: 0.9rem;
        }
        .external-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="topbar-left">
            <a href="index.html" class="back-btn">←</a>
            <div>
                <h2 class="station-title" id="ui-station-name">Loading...</h2>
                <div class="station-meta" id="ui-station-meta">...</div>
            </div>
        </div>
        <div class="topbar-right">
            <span class="progress-text" id="ui-progress">0 of 0</span>
            <button class="btn-flag" id="btn-flag" onclick="toggleFlag()">⚑ Flag</button>
            <button class="btn-filter" onclick="document.getElementById('filter-overlay').style.display='flex'">🔍 Search</button>
        </div>
    </div>

    <!-- Search/Filter Overlay -->
    <div id="filter-overlay" class="filter-overlay">
        <div class="filter-modal">
            <h3 style="margin-top:0;">Search & Filter</h3>
            <div class="form-group">
                <label>Search by Name</label>
                <input type="text" id="filter-name" placeholder="Station name...">
            </div>
            <div class="form-group">
                <label>Status</label>
                <select id="filter-status">
                    <option value="">Any</option>
                    <option value="unreviewed">Unreviewed</option>
                    <option value="needs_review">Needs Review</option>
                    <option value="in_progress">In Progress</option>
                    <option value="complete">Complete</option>
                    <option value="flagged">Flagged</option>
                </select>
            </div>
            <div class="form-group">
                <label>Region</label>
                <select id="filter-region">
                    <option value="">Any</option>
                </select>
            </div>
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button class="btn btn-primary" style="flex:1" onclick="applyFilters()">Apply</button>
                <button class="btn btn-secondary" onclick="document.getElementById('filter-overlay').style.display='none'">Close</button>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="sidebar">

            <div class="panel-section">
                <h3>Station Properties</h3>
                <div class="form-group">
                    <label>Has Car Park?</label>
                    <div class="toggle-group">
                        <div class="toggle-btn" id="cp-yes" onclick="setCarPark(true)">Yes</div>
                        <div class="toggle-btn" id="cp-no" onclick="setCarPark(false)">No</div>
                        <div class="toggle-btn" id="cp-unsure" onclick="setCarPark(null)">?</div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="ui-category" onchange="updateCategory()">
                        <option value="large">Large Station</option>
                        <option value="medium">Medium Station</option>
                        <option value="small">Small Station</option>
                        <option value="major">Major Terminal</option>
                        <option value="local">Local Stop</option>
                        <option value="city_centre">City Centre P&R</option>
                        <option value="edge_of_town">Edge of Town P&R</option>
                        <option value="motorway_junction">Motorway Junction P&R</option>
                    </select>
                </div>
            </div>

            <div class="panel-section">
                <h3>Existing Pins</h3>
                <div class="pins-list" id="ui-pins-list">
                    <!-- Populated by JS -->
                </div>
                <button class="btn btn-secondary" style="width:100%; margin-top:10px;" onclick="startNewPin()">+ Add new entrance pin</button>
            </div>

            <div class="panel-section" id="active-pin-panel" style="background: rgba(14, 165, 233, 0.1);">
                <h3>Active Pin Details</h3>
                <div class="form-group">
                    <label>Entrance Type</label>
                    <select id="pin-type" onchange="updateActivePinDisplay()">
                        <option value="main">Main Entrance</option>
                        <option value="car_park">Car Park Entrance</option>
                        <option value="bus_interchange">Bus Interchange</option>
                        <option value="cycle_entrance">Cycle Entrance</option>
                        <option value="taxi_rank">Taxi Rank</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="checkbox-group">
                        <input type="checkbox" id="pin-primary">
                        Is Primary / Most Used (for this type)
                    </label>
                </div>
                <div class="form-group">
                    <label>Notes (Optional)</label>
                    <input type="text" id="pin-notes" placeholder="e.g., Station Street entrance" maxlength="200">
                </div>

                <div class="coords-display" id="ui-coords">Lat: --<br>Lng: --</div>

                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button class="btn btn-primary" style="flex:1" onclick="saveActivePin()">Save Pin</button>
                    <button class="btn btn-secondary" onclick="cancelActivePin()">Cancel</button>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-success" id="btn-complete" onclick="markComplete()">✓ Mark Station Complete</button>

                <div class="nav-buttons">
                    <button class="btn btn-secondary" onclick="prevStation()">← Prev</button>
                    <button class="btn btn-secondary" onclick="skipStation()">Skip →</button>
                    <button class="btn btn-secondary" onclick="nextStation()">Next →</button>
                </div>
            </div>

        </div>
        <div id="map">
            <button class="btn btn-secondary" style="position: absolute; top: 10px; right: 10px; z-index: 1000; padding: 5px 10px; font-size: 0.8rem;" onclick="locateMe()">📍 Locate Me</button>
        </div>
    </div>

    <div id="toast">Saved ✓</div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let type = urlParams.get('type') || 'rail';
        let filterMode = urlParams.get('filter') || 'queue'; // 'queue', 'needs_review', 'flagged', 'all'

        let allData = [];
        let queue = [];
        let currentIndex = 0;
        let map;
        let activeMarker = null;
        let autoMarkers = {};
        let confirmedMarkers = {};

        const pinColors = {
            'main': '#3b82f6', // blue
            'car_park': '#f97316', // orange
            'bus_interchange': '#22c55e', // green
            'cycle_entrance': '#eab308', // yellow
            'taxi_rank': '#ef4444' // red
        };

        const pinLayerOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
        const pinLayerSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 });

        function createCustomIcon(color, confidence, confirmed) {
            let opacity = 1.0;
            let stroke = 'none';
            let strokeWidth = 0;
            let dasharray = 'none';
            let pulseClass = '';

            if (!confirmed) {
                if (confidence === 'medium') {
                    opacity = 0.7;
                    stroke = 'white';
                    strokeWidth = 2;
                    dasharray = '3,3';
                } else if (confidence === 'low') {
                    opacity = 0.4;
                    stroke = 'red';
                    strokeWidth = 3;
                    pulseClass = 'pulse-anim';
                } else if (confidence === 'none') {
                    opacity = 0.8;
                    stroke = 'white';
                    strokeWidth = 1;
                }
            }

            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="40" viewBox="0 0 30 40" class="${pulseClass}" style="opacity: ${opacity}">
                    <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 25 15 25s15-14.5 15-25C30 6.7 23.3 0 15 0zm0 22c-3.9 0-7-3.1-7-7s3.1-7 7-7 7 3.1 7 7-3.1 7-7 7z" fill="${color}" stroke="${stroke}" stroke-width="${strokeWidth}" stroke-dasharray="${dasharray}"/>
                    <circle cx="15" cy="15" r="5" fill="white"/>
                </svg>`;
            return L.divIcon({
                className: 'custom-pin',
                html: svg,
                iconSize: [30, 40],
                iconAnchor: [15, 40]
            });
        }

        async function init() {
            // Setup Map
            map = L.map('map', {
                zoomControl: true,
                layers: [pinLayerOSM]
            });

            L.control.layers({
                "Map (OSM)": pinLayerOSM,
                "Satellite (Esri)": pinLayerSat
            }).addTo(map);

            // Click on map to move active pin
            map.on('click', function(e) {
                if (activeMarker) {
                    activeMarker.setLatLng(e.latlng);
                    updateCoordsDisplay(e.latlng);
                }
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

                if (e.key === 'ArrowRight') nextStation();
                if (e.key === 'ArrowLeft') prevStation();
                if (e.key.toLowerCase() === 's') skipStation();
                if (e.key.toLowerCase() === 'f') toggleFlag();
                if (e.key.toLowerCase() === 'z') {
                    // Undo functionality (cancel active pin if open, else remove last saved)
                    if (activeMarker) cancelActivePin();
                else if (queue[currentIndex] && queue[currentIndex].entrances && queue[currentIndex].entrances.length > 0) {
                    deletePin(queue[currentIndex].entrances.length - 1);
                    }
                }
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault(); // prevent scroll
                    if (activeMarker) saveActivePin();
                    else {
                        const btn = document.getElementById('btn-complete');
                        if (!btn.disabled) markComplete();
                    }
                }
                if (e.key === '1') { map.addLayer(pinLayerOSM); map.removeLayer(pinLayerSat); }
                if (e.key === '2') { map.addLayer(pinLayerSat); map.removeLayer(pinLayerOSM); }
            });

            await loadData();
            buildQueue();

            if (filterMode === 'queue') {
                const lastId = localStorage.getItem(`hubconfirm_last_id_${type}`);
                if (lastId) {
                    const idx = queue.findIndex(s => s.id === lastId);
                    if (idx !== -1) currentIndex = idx;
                }
            } else {
                currentIndex = 0;
            }

            renderStation();
        }

        async function loadData() {
            const lsKey = `hubconfirm_${type}`;
            const stored = localStorage.getItem(lsKey);
            if (stored) {
                allData = JSON.parse(stored);
            } else {
                try {
                    let filename = type;
                    if(type === 'rail') filename = 'rail_stations';
                    const res = await fetch(`data/${filename}.json`);
                    allData = await res.json();
                } catch (e) {
                    alert("Failed to load initial data. Using empty set.");
                    allData = [];
                }
            }
        }

        function buildQueue() {
            if (filterMode === 'flagged') {
                queue = allData.filter(s => s.flagged);
            } else if (filterMode === 'needs_review') {
                queue = allData.filter(s => s.status === 'needs_review' && s.status !== 'complete');
            } else if (filterMode === 'all') {
                queue = [...allData];
            } else {
                // Default Smart Queue Order
                // needs_review -> unreviewed -> in_progress -> skipped
                const needs = allData.filter(s => s.status === 'needs_review');
                const unrev = allData.filter(s => s.status === 'unreviewed' || s.status === 'untouched');
                const inprog = allData.filter(s => s.status === 'in_progress' || s.status === 'partial');
                const skipped = allData.filter(s => s.status === 'skipped');

                queue = [...needs, ...unrev, ...inprog, ...skipped];

                // If everything is complete
                if (queue.length === 0) {
                    queue = allData.filter(s => s.status === 'complete');
                }
            }
            populateRegionFilter();
        }

        function populateRegionFilter() {
            const regions = new Set();
            allData.forEach(s => {
                if(s.region) regions.add(s.region);
            });
            const sel = document.getElementById('filter-region');
            sel.innerHTML = '<option value="">Any</option>';
            Array.from(regions).sort().forEach(r => {
                sel.innerHTML += `<option value="${r}">${r}</option>`;
            });
        }

        function applyFilters() {
            const fName = document.getElementById('filter-name').value.toLowerCase();
            const fStatus = document.getElementById('filter-status').value;
            const fRegion = document.getElementById('filter-region').value;

            queue = allData.filter(s => {
                let match = true;
                if (fName && !s.name.toLowerCase().includes(fName)) match = false;
                if (fStatus) {
                    if (fStatus === 'flagged' && !s.flagged) match = false;
                    else if (fStatus !== 'flagged' && s.status !== fStatus && !(fStatus==='unreviewed' && s.status==='untouched') && !(fStatus==='in_progress' && s.status==='partial')) match = false;
                }
                if (fRegion && s.region !== fRegion) match = false;
                return match;
            });

            document.getElementById('filter-overlay').style.display = 'none';
            currentIndex = 0;
            renderStation();
        }

        function saveData() {
            localStorage.setItem(`hubconfirm_${type}`, JSON.stringify(allData));
            if (queue.length > 0 && filterMode === 'queue') {
                localStorage.setItem(`hubconfirm_last_id_${type}`, queue[currentIndex].id);
            }
            showToast();
        }

        function showToast() {
            const t = document.getElementById('toast');
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 2000);
        }

        function renderStation() {
            if (!queue || queue.length === 0) {
                document.getElementById('ui-station-name').innerText = "Queue Empty";
                document.getElementById('ui-station-meta').innerText = "Return to Dashboard";
                return;
            }

            if (currentIndex < 0) currentIndex = 0;
            if (currentIndex >= queue.length) currentIndex = queue.length - 1;

            const st = queue[currentIndex];

            if (filterMode === 'queue') {
                localStorage.setItem(`hubconfirm_last_id_${type}`, st.id);
            }

            // Update UI
            document.getElementById('ui-station-name').innerText = st.name;
            document.getElementById('ui-station-meta').innerText = `${st.region} · ${st.category || 'Unknown'} · ID: ${st.id}`;
            document.getElementById('ui-progress').innerText = `${currentIndex + 1} of ${queue.length}`;

            // Category Select
            const catSelect = document.getElementById('ui-category');
            if(st.category) catSelect.value = st.category;

            // Flag
            const btnFlag = document.getElementById('btn-flag');
            if (st.flagged) btnFlag.classList.add('active');
            else btnFlag.classList.remove('active');

            // Car Park toggles
            updateCarParkUI(st.has_car_park);

            // External Links UI
            let linksHtml = `<a href="https://www.openstreetmap.org/?mlat=${st.centre_lat}&mlon=${st.centre_lng}#map=17/${st.centre_lat}/${st.centre_lng}" target="_blank">OSM ↗</a>`;
            linksHtml += `<a href="https://www.google.com/maps?q=${st.centre_lat},${st.centre_lng}" target="_blank">Google ↗</a>`;
            linksHtml += `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${st.centre_lat},${st.centre_lng}" target="_blank">Street View ↗</a>`;
            if (st.source_url) {
                linksHtml += `<a href="${st.source_url}" target="_blank">Wiki ↗</a>`;
            }

            // Just putting them under the station meta temporarily, ideally they have a dedicated div
            document.getElementById('ui-station-meta').innerHTML = `${st.region} · ${st.category || 'Unknown'} · ID: ${st.id}<br><div class="external-links" style="margin-top:5px;">${linksHtml}</div>`;


            // Clear map
            if (activeMarker) { map.removeLayer(activeMarker); activeMarker = null; }
            Object.values(autoMarkers).forEach(m => map.removeLayer(m));
            Object.values(confirmedMarkers).forEach(m => map.removeLayer(m));
            autoMarkers = {};
            confirmedMarkers = {};

            // Render existing pins
            st.entrances = st.entrances || [];
            st.entrances.forEach((ent, idx) => {
                addPinMarker(ent, idx);
            });

            renderPinsList();
            cancelActivePin(); // Hide active pin panel initially

            // Center map
            if (st.entrances.length > 0) {
                map.setView([st.entrances[0].lat, st.entrances[0].lng], 17);
            } else if (st.centre_lat && st.centre_lng) {
                map.setView([st.centre_lat, st.centre_lng], 16);
            } else {
                map.setView([54.0, -2.0], 6); // UK Center
            }

            checkCompleteState();
        }

        function setCarPark(val) {
            const st = queue[currentIndex];
            st.has_car_park = val;
            updateCarParkUI(val);

            // If No or Unsure, remove any existing car park pins
            if (val !== true) {
                st.entrances = st.entrances.filter(e => e.entrance_type !== 'car_park');
            }

            saveData();
            renderStation(); // re-render to update pins/lists
        }

        function updateCarParkUI(val) {
            document.getElementById('cp-yes').classList.remove('active-yes');
            document.getElementById('cp-no').classList.remove('active-no');
            document.getElementById('cp-unsure').classList.remove('active-unsure');

            if (val === true) document.getElementById('cp-yes').classList.add('active-yes');
            if (val === false) document.getElementById('cp-no').classList.add('active-no');
            if (val === null) document.getElementById('cp-unsure').classList.add('active-unsure');

            // Filter dropdown options based on has_car_park
            const typeSelect = document.getElementById('pin-type');
            Array.from(typeSelect.options).forEach(opt => {
                if (opt.value === 'car_park') {
                    opt.disabled = (val !== true);
                    if (opt.disabled && typeSelect.value === 'car_park') typeSelect.value = 'main';
                }
            });
        }

        function updateCategory() {
            const st = queue[currentIndex];
            st.category = document.getElementById('ui-category').value;
            saveData();
        }

        function toggleFlag() {
            const st = queue[currentIndex];
            st.flagged = !st.flagged;
            saveData();
            renderStation();
        }

        /* Pin Logic */

        function renderPinsList() {
            const st = queue[currentIndex];
            const list = document.getElementById('ui-pins-list');
            list.innerHTML = '';

            st.entrances.forEach((ent, idx) => {
                const div = document.createElement('div');
                div.className = `pin-item pin-type-${ent.entrance_type}`;

                let confStatus = ent.confirmed ? '✅' : '❓';
                if (!ent.confirmed) {
                     if (ent.confidence === 'low') confStatus = '⚠️';
                     if (ent.confidence === 'high') confStatus = '🔹';
                }

                div.innerHTML = `
                    <div onclick="editPin(${idx})" style="flex:1; cursor:pointer;">
                        <strong>${confStatus} ${formatType(ent.entrance_type)}</strong>
                        ${ent.is_primary ? '<small> (Primary)</small>' : ''}
                        <div style="font-size:0.8rem; color:var(--text-muted)">${ent.confidence} conf. ${ent.confirmed ? '| Confirmed' : ''}</div>
                        ${ent.notes ? `<div style="font-size:0.8rem; color:var(--text-muted)">${ent.notes}</div>` : ''}
                    </div>
                    <div class="pin-actions">
                        ${!ent.confirmed ? `<span onclick="confirmPin(${idx})">✅</span>` : ''}
                        <span onclick="deletePin(${idx})">🗑</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function formatType(type) {
            return type.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        }

        function addPinMarker(ent, idx) {
            const color = pinColors[ent.entrance_type] || pinColors['main'];
            const marker = L.marker([ent.lat, ent.lng], {
                icon: createCustomIcon(color, ent.confidence, ent.confirmed),
                draggable: false
            }).addTo(map);

            marker.bindPopup(`<b>${formatType(ent.entrance_type)}</b><br>${ent.confirmed ? 'Confirmed' : 'Unconfirmed'} (${ent.confidence})`);

            if (ent.confirmed) {
                confirmedMarkers[idx] = marker;
            } else {
                autoMarkers[idx] = marker;
            }
        }

        function confirmPin(idx) {
            const st = queue[currentIndex];
            st.entrances[idx].confirmed = true;
            st.entrances[idx].confirmed_at = new Date().toISOString();

            saveData();
            renderStation();
        }

        // Active Pin Editing
        let editingIndex = -1;

        function startNewPin() {
            const st = queue[currentIndex];
            editingIndex = -1;
            document.getElementById('active-pin-panel').style.display = 'block';
            document.getElementById('pin-notes').value = '';
            document.getElementById('pin-primary').checked = true;

            // Default to main if no main exists
            const hasMain = st.entrances.some(e => e.entrance_type === 'main');
            if (!hasMain) document.getElementById('pin-type').value = 'main';

            // Place active pin at center of current map view
            const center = map.getCenter();
            createActiveMarker(center.lat, center.lng, document.getElementById('pin-type').value, 'high', false);
        }

        function editPin(idx) {
            const st = queue[currentIndex];
            const ent = st.entrances[idx];
            editingIndex = idx;

            document.getElementById('active-pin-panel').style.display = 'block';
            document.getElementById('pin-type').value = ent.entrance_type;
            document.getElementById('pin-primary').checked = ent.is_primary;
            document.getElementById('pin-notes').value = ent.notes || '';

            // Hide the confirmed/auto marker temporarily
            if(confirmedMarkers[idx]) map.removeLayer(confirmedMarkers[idx]);
            if(autoMarkers[idx]) map.removeLayer(autoMarkers[idx]);

            createActiveMarker(ent.lat, ent.lng, ent.entrance_type, ent.confidence, ent.confirmed);
            map.setView([ent.lat, ent.lng]);
        }

        function createActiveMarker(lat, lng, eType, confidence, confirmed) {
            if (activeMarker) map.removeLayer(activeMarker);

            const color = pinColors[eType] || pinColors['main'];

            activeMarker = L.marker([lat, lng], {
                icon: createCustomIcon(color, confidence, confirmed),
                draggable: true,
                zIndexOffset: 1000
            }).addTo(map);

            activeMarker.on('drag', function(e) {
                updateCoordsDisplay(e.target.getLatLng());
            });

            updateCoordsDisplay({lat, lng});

            // Highlight active marker visually
            setTimeout(() => {
                if(activeMarker && activeMarker.getElement()) {
                    activeMarker.getElement().style.filter = "drop-shadow(0 0 10px white)";
                }
            }, 100);
        }

        function updateActivePinDisplay() {
            if (activeMarker) {
                const eType = document.getElementById('pin-type').value;
                const color = pinColors[eType] || pinColors['main'];
                // Assume high confidence and confirmed if editing type
                activeMarker.setIcon(createCustomIcon(color, 'high', true));
            }
        }

        function updateCoordsDisplay(latlng) {
            document.getElementById('ui-coords').innerHTML = `Lat: ${latlng.lat.toFixed(6)}<br>Lng: ${latlng.lng.toFixed(6)}`;
        }

        function cancelActivePin() {
            document.getElementById('active-pin-panel').style.display = 'none';
            if (activeMarker) { map.removeLayer(activeMarker); activeMarker = null; }
            if (editingIndex !== -1) {
                if(confirmedMarkers[editingIndex]) confirmedMarkers[editingIndex].addTo(map);
                if(autoMarkers[editingIndex]) autoMarkers[editingIndex].addTo(map);
            }
            editingIndex = -1;
        }

        function saveActivePin() {
            if (!activeMarker) return;

            const st = queue[currentIndex];
            const pos = activeMarker.getLatLng();
            const eType = document.getElementById('pin-type').value;
            const isPrimary = document.getElementById('pin-primary').checked;
            const notes = document.getElementById('pin-notes').value.trim();

            // Enforce Primary rule: Only one primary per type
            if (isPrimary) {
                st.entrances.forEach(e => {
                    if (e.entrance_type === eType && e !== (editingIndex !== -1 ? st.entrances[editingIndex] : null)) {
                        e.is_primary = false;
                    }
                });
            }

            const newEntrance = {
                entrance_id: `${st.id}_${eType}_${Date.now()}`, // simple ID gen
                entrance_type: eType,
                is_primary: isPrimary,
                lat: parseFloat(pos.lat.toFixed(6)),
                lng: parseFloat(pos.lng.toFixed(6)),
                notes: notes,
                confirmed: true,
                confidence: "high", // Saving a pin means it's confirmed & high conf
                confirmed_at: new Date().toISOString(),
                source: "operator"
            };

            if (editingIndex !== -1) {
                // Keep old ID and source if we're just modifying
                newEntrance.entrance_id = st.entrances[editingIndex].entrance_id;
                newEntrance.source = st.entrances[editingIndex].source;
                st.entrances[editingIndex] = newEntrance;
            } else {
                st.entrances.push(newEntrance);
            }

            st.status = 'in_progress';

            saveData();
            renderStation();
        }

        function deletePin(idx) {
            if(confirm("Delete this pin?")) {
                queue[currentIndex].entrances.splice(idx, 1);
                saveData();
                renderStation();
            }
        }

        /* Navigation & Status */

        function checkCompleteState() {
            const st = queue[currentIndex];
            const btn = document.getElementById('btn-complete');

            const hasMain = st.entrances.some(e => e.entrance_type === 'main');
            const hasCarParkResponded = (st.has_car_park === true || st.has_car_park === false);
            const allConfirmed = st.entrances.length > 0 && st.entrances.every(e => e.confirmed);

            if (hasMain && hasCarParkResponded && allConfirmed) {
                btn.disabled = false;
                btn.innerText = "✓ Mark Station Complete";
            } else {
                btn.disabled = true;
                if (!hasMain) btn.innerText = "Requires Main Entrance";
                else if (!hasCarParkResponded) btn.innerText = "Requires Car Park answer";
                else if (!allConfirmed) btn.innerText = "Confirm all pins";
            }
        }

        function markComplete() {
            const st = queue[currentIndex];
            st.status = 'complete';
            st.skipped = false;
            saveData();

            // Auto advance
            nextStation();
        }

        function skipStation() {
            const st = queue[currentIndex];
            st.status = 'skipped';
            st.skipped = true;
            saveData();
            nextStation();
        }

        function locateMe() {
            map.locate({setView: true, maxZoom: 16});
            map.on('locationerror', function(e) {
                alert("Could not find your location: " + e.message);
            });
        }

        function nextStation() {
            if (currentIndex < queue.length - 1) {
                currentIndex++;
                renderStation();
            } else {
                // If we've hit the end of the current queue...
                alert("End of current queue reached.");
                window.location.href = "index.html";
            }
        }

        function prevStation() {
            if (currentIndex > 0) {
                currentIndex--;
                renderStation();
            }
        }

        // Bootstrap
        window.onload = init;
    </script>
</body>
</html>
