name: Scrape and Geocode Hubs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Run monthly at midnight on the first day of the month

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Scraper
        run: python scripts/scrape_wikipedia.py

      - name: Run Geocoder
        run: python scripts/geocode_nominatim.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "chore: Update hub data from Wikipedia and Nominatim"
          git push
