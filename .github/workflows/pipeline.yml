name: Scrape and Geocode Hubs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *' # Run monthly at midnight on the first day of the month

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Scrape Stations
        run: python scripts/1_scrape_stations.py

      - name: Fetch Entrances (Overpass)
        run: python scripts/2_fetch_entrances.py

      - name: Merge and Score Data
        run: python scripts/3_merge_and_score.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          # Commit only if there are changes
          git diff --staged --quiet || git commit -m "chore: Update hub data pipeline"
          git push